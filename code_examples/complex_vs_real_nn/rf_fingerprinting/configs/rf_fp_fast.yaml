mode: fast
dataset_path: ""
output_dir: outputs/rf_fingerprinting_fast
seed: 7

seq_len: 256
n_devices: 6
n_sessions: 2
n_samples: 800

test_size: 0.2
val_size: 0.2

batch_size: 64
embed_dim: 64
pretrain_epochs: 2
finetune_epochs: 5
lr: 0.001
weight_decay: 0.0001
temperature: 0.2

noise_std: 0.05
phase_jitter_rad: 0.05
time_shift: 8
cfo_jitter_rad: 0.0
amplitude_jitter: 0.05
aug_prob: 0.5

grad_clip: 0.0
dropout: 0.0
encoder_lr_scale: 1.0
warmup_epochs: 1
